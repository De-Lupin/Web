<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý vận tải hàng hóa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>🚚 Hệ thống quản lý vận tải</h2>
    <p class="note">(*) thông tin bắt buộc</p>

    <!-- THÔNG TIN KHÁCH HÀNG -->
    <div class="section">
        <h3>Thông tin khách hàng đăng ký</h3>
        <div class="grid">
            <div class="form-group">
                <label>Họ và tên *</label>
                <input id="ten">
            </div>
            <div class="form-group">
                <label>Số điện thoại *</label>
                <input id="sdt">
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input id="email">
            </div>
            <div class="form-group">
                <label>Địa chỉ *</label>
                <input id="diachi">
            </div>
            <div class="form-group">
                <label>CMND/CCCD *</label>
                <input id="cccd">
            </div>
            <div class="form-group">
                <label>Tên công ty</label>
                <input id="congty">
            </div>
        </div>
    </div>

    <!-- CHI TIẾT ĐƠN HÀNG -->
    <div class="section">
        <h3>Chi tiết đơn hàng</h3>

        <!-- Người gửi / Người nhận -->
        <div class="grid">
            <div style="border-right: 1px solid #eee; padding-right: 15px;">
                <label style="color: #555;">NGƯỜI GỬI *</label>
                <input id="nguoigui_ten"    placeholder="Họ tên người gửi">
                <input id="nguoigui_sdt"    placeholder="SĐT người gửi">
                <input id="nguoigui_diachi" placeholder="Địa chỉ lấy hàng">
            </div>
            <div style="padding-left: 5px;">
                <label style="color: #555;">NGƯỜI NHẬN ĐƠN *</label>
                <input id="nguoinhan_ten"    placeholder="Họ tên người nhận">
                <input id="nguoinhan_sdt"    placeholder="SĐT người nhận">
                <input id="nguoinhan_diachi" placeholder="Địa chỉ giao hàng">
            </div>
        </div>

        <!-- Thông tin hàng hóa -->
        <div class="grid" style="margin-top: 20px;">
            <div class="form-group">
                <label>Tên hàng hóa *</label>
                <input id="tenhang">
            </div>
            <div class="form-group">
                <label>Ngày gửi đơn *</label>
                <input type="date" id="ngaygui">
            </div>
            <div class="form-group">
                <label>Loại hàng</label>
                <!-- input này sẽ được script.js thay bằng <select> khi DOM sẵn sàng -->
                <input id="loaihang">
            </div>
            <div class="form-group">
                <label>Khối lượng (kg)</label>
                <input id="khoiluong">
            </div>
            <div class="form-group">
                <label>Số lượng</label>
                <input id="soluong">
            </div>
        </div>

        <!-- Ghi chú (script.js sẽ chèn thêm nhóm vận chuyển phía trên label này) -->
        <label>Ghi chú</label>
        <textarea id="ghichu" rows="2"></textarea>
    </div>

    <!-- NÚT BẤM (script.js sẽ chèn hộp cước phí phía trên) -->
    <div class="button-group">
        <button onclick="themDonHang()"    id="btnThem"    class="btn-add">Thêm đơn hàng</button>
        <button onclick="xemLichSu()"      id="lichsuBtn"  class="btn-history">Xem lại đơn</button>
        <button onclick="capNhatDonHang()" id="capnhatBtn" class="btn-update">Cập nhật đơn</button>
    </div>

    <!-- THÔNG BÁO -->
    <div id="thongbao" class="message"></div>

    <!-- BẢNG LỊCH SỬ -->
    <div id="tableContainer" class="table-container">
        <h3>Danh sách đơn đã gửi</h3>
        <table>
            <thead>
                <tr>
                    <!-- Header sẽ được script.js cập nhật lại -->
                    <th>Khách hàng</th>
                    <th>SĐT</th>
                    <th>Hàng hóa</th>
                    <th>Ngày gửi</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="bang"></tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
